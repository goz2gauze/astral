  <body>
    <!-- First-load cover, copied from astralon.top: shown once per session for ~2s. -->
    <div id="academySplash" style="position:fixed;inset:0;z-index:2147483000;overflow:auto;background:#f7f6f2;transition:opacity .36s ease">
      <template shadowrootmode="open"><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f6f2;
  color: #1d2926;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  line-height: 1.55;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 40px;
  border-bottom: 1px solid rgba(29, 41, 38, 0.08);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #15342c;
}

.signin {
  padding: 8px 16px;
  border: 1px solid rgba(29, 41, 38, 0.15);
  border-radius: 8px;
  font-size: 13px;
  color: rgba(29, 41, 38, 0.7);
}

.signin:hover {
  border-color: rgba(29, 41, 38, 0.3);
}

main {
  height: 80vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 42px;
  margin: 0 0 14px;
  letter-spacing: -0.02em;
}

p {
  max-width: 480px;
  margin: 0;
  color: #5b6a64;
}

.cta {
  display: inline-block;
  margin-top: 26px;
  padding: 12px 24px;
  border-radius: 999px;
  background: #15342c;
  color: #f7f6f2;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
}

.cta:hover {
  background: #1d4237;
}

@media (max-width: 500px) {
  header {
    padding: 16px 20px;
  }

  h1 {
    font-size: 32px;
  }
}
.Aw2{margin:0;background:#f7f6f2;color:#1d2926;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55}.Aw2 a{color:inherit;text-decoration:none}.Aw2 button,.Aw2 input,.Aw2 select,.Aw2 textarea{font:inherit}#academyTimer{position:fixed;bottom:20px;right:24px;font:500 12px/1 Inter,system-ui,sans-serif;color:rgba(29,41,38,.45);letter-spacing:.02em;font-variant-numeric:tabular-nums}</style><div class="Aw2">
<header>
  <span class="brand"><span class="dot"></span>Academy</span>
  <a class="signin" href="#">Sign in</a>
</header>
<main>
  <h1>Education for everyone.</h1>
  <p>Learn at your own pace. Clear, simple lessons in math, science, and writing, made by real teachers.</p>
  <a class="cta" href="#">Get Started</a>
</main>
</div><div id="academyTimer">2s</div></template></div>
    <script>
      (() => {
        const cover = document.getElementById("academySplash");
        let seen = false;
        try {
          seen = sessionStorage.getItem("astral.academy.v1") === "1";
        } catch {}
        if (seen) {
          cover.remove();
          return;
        }
        try {
          sessionStorage.setItem("astral.academy.v1", "1");
        } catch {}
        document.documentElement.style.overflow = "hidden";
        const timer = cover.shadowRoot.getElementById("academyTimer");
        let seconds = 2;
        const tick = setInterval(() => {
          seconds -= 1;
          if (seconds <= 0) {
            clearInterval(tick);
            cover.style.opacity = "0";
            document.documentElement.style.overflow = "";
            setTimeout(() => cover.remove(), 360);
            return;
          }
          timer.textContent = seconds + "s";
        }, 1000);
      })();
    </script>

    <div class="browser-chrome" id="chrome">
      <header class="topbar">
        <button class="nav-btn" id="navBack" data-tip="Back" aria-label="Back"></button>
        <button class="nav-btn" id="navForward" data-tip="Forward" aria-label="Forward"></button>
        <button class="nav-btn" id="navReload" data-tip="Reload" aria-label="Reload"></button>
        <form class="urlbar" id="urlForm" autocomplete="off">
          <div class="search-engine" id="engineWrap">
            <button type="button" class="search-engine-trigger" id="engineBtn" aria-label="Choose search engine">
              <span id="engineIcon"></span>
            </button>
            <div class="search-engine-menu" id="engineMenu" hidden></div>
          </div>
          <input id="urlInput" type="text" placeholder="Search DuckDuckGo or type a URL" spellcheck="false" aria-label="Address bar" />
          <div class="urlbar-suggestions" id="urlSuggestions" hidden></div>
        </form>
        <button class="icon-btn" id="themeBtn" data-tip="Toggle theme" aria-label="Toggle theme"></button>
        <button class="icon-btn" id="navFullscreen" data-tip="Full screen" aria-label="Full screen"></button>
      </header>

      <div class="shell-body">
        <aside class="tab-strip" id="tabStrip" aria-label="Tabs and menu">
          <div class="tabs-list" id="tabs" role="tablist"></div>
          <nav class="vertical-sidebar-menu" id="menu" aria-label="Astral menu">
            <button class="new-tab-btn" id="menuNewTab"></button>
            <div class="vertical-menu-section" id="menuMain"></div>
            <div class="vertical-menu-divider"></div>
            <div class="vertical-menu-section" id="menuSecondary"></div>
          </nav>
        </aside>
        <main class="view-area" id="view"></main>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle sidebar" aria-expanded="true">‹</button>
    </div>

    <footer class="site-credit" id="siteCredit">
      <a class="site-credit-link" data-credit href="https://discord.gg/" target="_blank" rel="noopener noreferrer">recreated by goz!</a>
    </footer>

    <div id="overlays"></div>
    <div id="toastRoot"></div>
    <canvas class="particles-canvas" id="particles" aria-hidden="true"></canvas>

    <script src="./config.js"></script>
    <script type="module" src="./js/main.js?v=19"></script>
  </body>
